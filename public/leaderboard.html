<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Blackjack Leaderboard</title>
	<link rel="stylesheet" href="css/style.css">
	<script src="js/theme.js"></script>
</head>
<body class="page page-leaderboard">
	<main class="shell">
		<section class="card">
			<p class="eyebrow">Rankings</p>
			<h1>Leaderboard</h1>
			<p class="subtle">Shows all created accounts. Sorted by runs completed, then highest chapter.</p>
			<div class="actions">
				<a class="button-link" href="menu.html">Main Menu</a>
				<a class="button-link" href="lobby.html">Lobby</a>
				<button id="refreshButton">Refresh</button>
			</div>
			<p id="boardMessage" class="message" hidden></p>
			<div class="table-wrap">
				<table>
					<thead>
						<tr>
							<th>Rank</th>
							<th>Player</th>
							<th>Bankroll</th>
							<th>Wins</th>
							<th>Losses</th>
							<th>Pushes</th>
							<th>Games</th>
						</tr>
					</thead>
					<tbody id="leaderboardBody"></tbody>
				</table>
			</div>
		</section>
	</main>

	<script src="/socket.io/socket.io.js"></script>
	<script src="js/auth-storage.js"></script>
	<script src="js/socket.js"></script>
	<script src="js/leaderboard.js"></script>
</body>
</html>
