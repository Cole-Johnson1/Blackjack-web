<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmackJack Menu</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body class="page page-menu">
    <main class="shell home-shell menu-shell">
        <section class="card hero-card pixel-panel menu-card">
            <p class="eyebrow">SmackJack Terminal</p>
            <h1>Main Menu</h1>
            <p class="subtle" id="menuWelcomeText">Welcome back.</p>

            <div class="menu-grid">
                <button id="singlePlayerButton" type="button">Single Player</button>
                <button id="resetRunButton" type="button">Reset Run</button>
                <button id="multiPlayerButton" type="button">Multi Player</button>
                <button id="accountButton" type="button">Account</button>
                <button id="leaderboardButton" type="button">Leaderboard</button>
                <button id="adminPanelButton" type="button" hidden>Admin Panel</button>
                <button id="optionsButton" type="button">Options</button>
                <button id="logoutButton" type="button">Logout</button>
                <button id="exitButton" type="button">Exit</button>
            </div>

            <p id="menuMessage" class="message" hidden></p>
        </section>
    </main>

    <script src="js/auth-storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
