<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmackJack Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body class="page page-leaderboard">
    <main class="shell">
        <section class="card">
            <p class="eyebrow">Admin</p>
            <h1>Account Management</h1>
            <p class="subtle">Manage account roles and account access.</p>
            <div class="actions">
                <a class="button-link" href="menu.html">Main Menu</a>
                <button id="adminRefreshButton" type="button">Refresh</button>
                <button id="adminClearAccountsButton" type="button">Clear Accounts</button>
            </div>
            <p id="adminMessage" class="message" hidden></p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Display Name</th>
                            <th>Admin</th>
                            <th>Disabled</th>
                            <th>Level</th>
                            <th>Games</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminAccountsBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/auth-storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
