<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmackJack</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/game-pov.css">
    <script src="js/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body class="page-game game-pov-body">

    <!-- Blood vignette: intensifies as HP drops -->
    <div id="bloodScreen" class="blood-screen" aria-hidden="true"></div>

    <!-- Hit flash: red flash when player is struck -->
    <div id="hitFlash" class="hit-flash" aria-hidden="true"></div>

    <!-- Impact bursts for punch readability -->
    <div id="dealerImpact" class="impact-burst dealer-impact" aria-hidden="true"></div>
    <div id="playerImpact" class="impact-burst player-impact" aria-hidden="true"></div>

    <!-- Top-left burger button opens in-game ESC menu -->
    <button id="menuBurgerButton" type="button" class="menu-burger-button" aria-label="Open settings menu" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>

    <!-- ═══════════════════════════════════════════════════════════
         GAME VIEWPORT — full screen, no scroll
    ═══════════════════════════════════════════════════════════════ -->
    <div class="game-viewport" id="gameViewport">

        <!-- ── TOP HUD BAR ──────────────────────────────────── -->
        <header class="hud-top-bar">
            <div class="hud-top-left">
                <span class="hud-mode-label" id="modeLabel"></span>
                <span id="roomCodeRow" class="hud-room-label">Room: <strong id="roomCodeText">-</strong></span>
            </div>
            <div class="hud-top-center">
                <h1 class="game-title-hud">SmackJack</h1>
                <p id="roundCounter" class="round-counter-hud"></p>
            </div>
            <div class="hud-top-right">
                <p id="tableStatus" class="table-status-hud">Waiting...</p>
                <div id="turnTimerDisplay" class="turn-timer-display" hidden></div>
            </div>
        </header>

        <!-- ── DEALER SECTION ────────────────────────────────── -->
        <section class="dealer-section">

            <!-- Dealer stats strip (HP bar, ATK, tier) -->
            <div class="dealer-stats-hud">
                <span class="dealer-label-tag">⚠ DEALER</span>
                <!-- battleP1 populated by renderBattleBar() -->
                <div id="battleP1" class="dealer-stat-pills"></div>
                <div id="dealerHpBarWrap" class="dealer-hp-bar-wrap">
                    <div class="dealer-hp-bar-track">
                        <div class="dealer-hp-bar-fill" id="dealerHpBarFill" style="width:100%"></div>
                    </div>
                </div>
            </div>

            <!-- Dealer character sprite + cards side by side -->
            <div class="dealer-arena">

                <!-- CSS pixel-art dealer character -->
                <div class="dealer-character-wrap">
                    <div class="dealer-sprite" id="dealerSprite">
                        <div class="dealer-hat"></div>
                        <div class="dealer-head"></div>
                        <div class="dealer-torso"></div>
                        <div class="dealer-arm dealer-arm-left" id="dealerArmLeft"></div>
                        <div class="dealer-arm dealer-arm-right" id="dealerArmRight"></div>
                    </div>
                </div>

                <!-- Dealer cards & hand info -->
                <div class="dealer-cards-zone">
                    <div id="dealerCards" class="card-row dealer-cards-row"></div>
                    <p id="dealerValue" class="hand-value-hud"></p>
                    <p id="dealerCombatStats" class="dealer-combat-stats"></p>
                </div>

            </div>
        </section>

        <!-- ── TABLE EDGE / MESSAGES STRIP ──────────────────── -->
        <div class="table-messages">
            <p id="roundBanner" class="round-banner-pov" hidden></p>
            <p id="gameMessage" class="game-message-pov" hidden></p>
        </div>

        <!-- ── PLAYER SECTION (felt table surface) ──────────── -->
        <section class="player-section">

            <!-- Player cards on the table -->
            <div class="player-cards-zone">
                <div id="players" class="players-pov-grid"></div>
            </div>

            <!-- Action buttons bar (centered beneath player cards) -->
            <div class="actions-center-bar">
                <div id="primaryActions" class="primary-actions">
                    <button id="hitButton" class="action-big">Hit</button>
                    <button id="standButton" class="action-big">Stand</button>
                    <button id="doubleButton" class="action-big">Double</button>
                    <button id="splitButton" class="action-big" hidden>Split</button>
                </div>
            </div>

            <!-- First-person arms row -->
            <div class="player-pov-row">
                <div class="player-arms-pov">
                    <div class="player-arm player-arm-left" id="playerArmLeft"></div>
                    <div class="player-arm-gap"></div>
                    <div class="player-arm player-arm-right" id="playerArmRight"></div>
                </div>
            </div>

            <!-- Floating ability HUD (bottom-right) -->
            <div class="abilities-panel abilities-panel-floating">
                <div class="ability-hud">
                    <div class="ability-header">
                        <h3>Abilities</h3>
                        <span id="abilityUsedNote" class="ability-used-note subtle small" hidden>1 per hand</span>
                    </div>
                    <div id="comboDisplay" class="combo-display" hidden></div>
                    <div id="abilityControls" class="ability-strip"></div>
                </div>
            </div>
        </section>

        <!-- ── BOTTOM HUD BAR (player stats + last round) ───── -->
        <footer class="player-hud-bar">
            <!-- battleP2 populated by renderBattleBar() with player stat pills -->
            <div id="battleP2" class="player-stat-pills"></div>
            <div class="last-round-summary-strip">
                <span class="eyebrow">Last Round</span>
                <div id="roundSummary" class="summary-strip"></div>
            </div>
        </footer>

    </div><!-- end .game-viewport -->

    <!-- Hidden summary section (data holder — display replaced by strip above) -->
    <div id="summarySection" style="display:none">
        <div id="roundSummaryFull" class="summary"></div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════
         MATCH OVER OVERLAY
    ═══════════════════════════════════════════════════════════════ -->
    <div id="matchOverSection" class="match-over-overlay" hidden>
        <div class="match-over-card pixel-panel">
            <p class="eyebrow">Run Over</p>
            <h2 id="matchWinnerText"></h2>
            <div class="actions" style="justify-content:center">
                <button id="rematchButton" hidden>Reset Run</button>
                <a class="button-link" href="lobby.html">Back To Lobby</a>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════
         SMALL UPGRADE MODAL (after each hand — level up)
    ═══════════════════════════════════════════════════════════════ -->
    <div id="upgradeModalOverlay" class="modal-overlay" hidden>
        <div class="modal-content upgrade-modal">
            <div class="modal-header">
                <p id="upgradeResultBanner" class="modal-result-banner"></p>
                <h2>Choose Your Upgrade</h2>
                <div id="upgradeTimer" class="timer-display"></div>
            </div>

            <div class="player-stats-display">
                <div class="stat-line">
                    <span class="stat-label">Level</span>
                    <span class="stat-current" id="statLevel">1</span>
                    <span class="stat-arrow">→</span>
                    <span class="stat-next" id="statLevelNext">2</span>
                </div>
                <div class="stat-line">
                    <span class="stat-label">Health</span>
                    <span class="stat-current" id="statHealth">0</span>
                    <span class="stat-arrow">→</span>
                    <span class="stat-next" id="statHealthNext">0</span>
                </div>
                <div class="stat-line">
                    <span class="stat-label">Attack</span>
                    <span class="stat-current" id="statAttack">0</span>
                    <span class="stat-arrow">→</span>
                    <span class="stat-next" id="statAttackNext">0</span>
                </div>
                <div class="stat-line">
                    <span class="stat-label">Mana</span>
                    <span class="stat-current" id="statMana">0</span>
                    <span class="stat-arrow">→</span>
                    <span class="stat-next" id="statManaNext">0</span>
                </div>
            </div>

            <div class="upgrade-options" id="upgradeOptions">
                <button id="modalUpgradeHealthButton" class="upgrade-option">
                    <span class="upgrade-name">Upgrade Health</span>
                    <span class="upgrade-value">+6 HP</span>
                </button>
                <button id="modalUpgradeAttackButton" class="upgrade-option">
                    <span class="upgrade-name">Upgrade Attack</span>
                    <span class="upgrade-value">+2 Damage</span>
                </button>
                <button id="modalUpgradeManaButton" class="upgrade-option">
                    <span class="upgrade-name">Upgrade Mana</span>
                    <span class="upgrade-value">+2 Mana</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════
         BIG UPGRADE MODAL (dealer defeated — blessing choice)
    ═══════════════════════════════════════════════════════════════ -->
    <div id="blessingModalOverlay" class="modal-overlay blessing-modal-overlay" hidden>
        <div class="modal-content blessing-modal">
            <div class="modal-header">
                <p class="blessing-eyebrow">⚔ Dealer Defeated!</p>
                <p id="blessingResultBanner" class="modal-result-banner"></p>
                <h2 id="blessingModalTitle">Choose Your Power-Up</h2>
                <div id="blessingTimer" class="timer-display"></div>
            </div>

            <div class="upgrade-options" id="blessingOptions">
                <!-- Populated dynamically from state.blessings -->
            </div>
        </div>
    </div>

    <div id="shopModalOverlay" class="modal-overlay blessing-modal-overlay" hidden>
        <div class="modal-content blessing-modal">
            <div class="modal-header">
                <p class="blessing-eyebrow">🛒 Boss Shop</p>
                <p id="shopResultBanner" class="modal-result-banner"></p>
                <h2 id="shopModalTitle">Choose 1 Reward</h2>
                <div id="shopTimer" class="timer-display"></div>
            </div>

            <div class="upgrade-options" id="shopOptions"></div>
        </div>
    </div>

    <!-- ESC / burger menu overlay -->
    <div id="escMenuOverlay" class="esc-menu-overlay" hidden>
        <div class="esc-menu-card pixel-panel" role="dialog" aria-modal="true" aria-labelledby="escMenuTitle">
            <p class="eyebrow">Paused</p>
            <h2 id="escMenuTitle">Game Menu</h2>
            <div class="esc-menu-actions">
                <button id="escResumeButton" type="button">Resume</button>
                <a id="escSettingsLink" class="button-link" href="options.html">Settings</a>
                <button id="escExitButton" type="button">Exit To Menu</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/auth-storage.js"></script>
    <script src="js/socket.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
