<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmackJack Lobby</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body class="page page-lobby">
    <main class="shell two-col lobby-shell">

        <!-- WAITING ROOM (appears after run starts, every 5 rounds) -->
        <section id="waitingRoomSection" class="card pixel-panel waiting-room">
            <div class="waiting-room-content">
                <div class="waiting-room-header">
                    <p class="eyebrow">Between Rounds</p>
                    <h2 id="waitingTitle">Prepare for Battle</h2>
                </div>

                <div class="waiting-room-stats" id="playerStatsWaiting"></div>

                <div class="players-waiting-list">
                    <h3>Party Members</h3>
                    <div class="waiting-players" id="waitingPlayersList"></div>
                </div>

                <div class="waiting-room-controls">
                    <button id="waitingReadyButton">Ready</button>
                </div>
            </div>
        </section>

        <!-- LOBBY CONTENT (regular lobby view before run) -->
        <section class="lobby-content">
            <section class="card pixel-panel lobby-main-card">
                <p class="eyebrow">Game Menu</p>
                <h1>Lobby</h1>
                <p>Room Code: <strong id="roomCodeText">-</strong></p>
                <input id="inviteLinkInput" readonly>
                <div class="actions">
                    <button id="copyInviteButton">Copy Invite</button>
                    <button id="createRoomButton">New Room</button>
                </div>

                <h3>Party</h3>
                <p>Total Players: <strong id="playerCount">0</strong></p>
                <ul id="playerList" class="list"></ul>

                <h3>Join Room</h3>
                <div class="inline-form">
                    <label for="joinRoomInput">Room Code</label>
                    <input type="text" id="joinRoomInput" maxlength="12" placeholder="ABC123">
                    <button id="joinRoomButton">Join</button>
                </div>
                <p id="lobbyMessage" class="message" hidden></p>
            </section>

            <section class="card pixel-panel lobby-side-card">
                <p class="eyebrow">Ready</p>
                <h2>Start Run</h2>
                <button id="startRunButton">Start</button>
                <a class="button-link" id="enterTableLink" href="game.html">Enter Table</a>
                <a class="button-link" href="menu.html">Main Menu</a>
                <button id="toggleRoomsButton">Open Rooms</button>
                <ul id="roomsList" class="list" hidden></ul>
                <button id="logoutButton">Log Out</button>
            </section>
        </section>

    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/auth-storage.js"></script>
    <script src="js/socket.js"></script>
    <script src="js/lobby.js"></script>
</body>
</html>
